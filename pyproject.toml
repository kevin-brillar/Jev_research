[project]
name = "atenxion-jev-research"
version = "0.2.0"
description = "Jev (TypeSafe System One) decision gates for Atenxion agent workflows on Google ADK 1.31 and ADK 2.8"
# Matches atenxion-agentic-backend and atenxion-agentic-gemini-2.0 (both pin "==3.13.*").
requires-python = "==3.13.*"
dependencies = [
    # Shared pins copied from the production services so this scaffold cannot drift:
    #   jsonschema / pydantic  <- atenxion-agentic-gemini-2.0 (workflow-spec validation)
    #   pyyaml                 <- atenxion-agentic-backend
    "jsonschema==4.26.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "typesafe-sdk==0.7.4",
]

[project.optional-dependencies]
# one runtime per environment; versions are the production pins
adk1 = ["google-adk[a2a]==1.31.0"]   # == atenxion-agentic-backend
adk2 = ["google-adk[mcp]==2.8.0"]    # == atenxion-agentic-gemini-2.0

[dependency-groups]
# same dev pins as both production services (they use [dependency-groups] too)
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
conflicts = [
    [
        { extra = "adk1" },
        { extra = "adk2" },
    ],
]
